const PM = {"weibo": ["微博", "#e6162d"], "xhs": ["小红书", "#ff2442"], "douyin": ["抖音", "#161823"], "kuaishou": ["快手", "#ff5000"], "heimao": ["黑猫投诉", "#1f74c9"], "news": ["新闻媒体", "#7a5af8"]};
const BM = {"DESCENTE": ["迪桑特 DESCENTE", "迪桑特", "#c8102e"], "WILSON": ["Wilson 威尔胜", "威尔胜", "#0b7d3e"], "MONTANE": ["Montane 盟泰恩", "盟泰恩", "#1f6feb"]};
const COVORDER = ["weibo", "xhs", "douyin", "kuaishou", "heimao"];   // 覆盖矩阵展示的渠道（新闻媒体无独立产物，不参与矩阵）
const CIRCLED = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳";

let state = {batch: null, brand: "ALL", onlyNeg: false, q: ""};

function esc(s){return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function hl(s){
  s = esc(s);
  const q = state.q.trim();
  if(!q) return s;
  try{ return s.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"), "<mark>$1</mark>"); }catch(e){ return s; }
}
function platPill(k){
  const m = PM[k]; if(!m) return "";
  return '<span class="pp" style="background:'+m[1]+'">'+esc(m[0])+'</span>';
}
function brandName(k){ const m = BM[k]; return m ? m[0] : (k||"—"); }

function renderKpis(){
  const batches = DATA.batches.length;
  const entries = DATA.batches.reduce((a,b)=>a+b.entries.length,0);
  const hitBrands = DATA.batches.reduce((a,b)=>a+b.entries.length>0?1:0,0);
  const last = DATA.batches[0];
  document.getElementById("kpis").innerHTML =
    '<div class="kpi"><b>'+batches+'</b><span>已归档班次</span></div>'+
    '<div class="kpi"><b class="warn">'+entries+'</b><span>负面条目累计</span></div>'+
    '<div class="kpi"><b>'+(last? (last.date.slice(0,2)+"/"+last.date.slice(2)+" "+last.time.slice(0,2)+":"+last.time.slice(2)) : "—")+'</b><span>最新班次</span></div>';
}

function renderBatchList(){
  const el = document.getElementById("batchList");
  el.innerHTML = DATA.batches.map(b=>{
    const n = b.entries.length;
    const ng = b.noneg_brands.length;
    const badge = n>0 ? '<span class="badge neg">✘ '+n+'</span>'
                      : (ng>0 ? '<span class="badge ok">✔ 无负面</span>' : '<span class="badge">—</span>');
    const dt = b.date.slice(0,2)+"/"+b.date.slice(2)+" "+b.time.slice(0,2)+":"+b.time.slice(2);
    return '<button class="batch'+(state.batch===b.key?" on":"")+'" data-key="'+b.key+'">'+
      '<span class="r1"><span class="dt">'+dt+'</span>'+badge+'</span>'+
      '<span class="wt">'+esc(b.window||"")+'</span></button>';
  }).join("") || '<div class="empty">暂无数据</div>';
  el.querySelectorAll(".batch").forEach(btn=>btn.onclick=()=>{
    state.batch = btn.dataset.key; render();
  });
}

function entryMatches(e){
  if(state.brand!=="ALL" && e.brand!==state.brand) return false;
  const q = state.q.trim().toLowerCase();
  if(!q) return true;
  const blob = [e.title, e.author, e.platform_raw, e.publish_time, e.interaction, e.note].join(" ").toLowerCase();
  return blob.indexOf(q)>=0;
}

function entryHtml(e, idx, brandColor){
  const labels = (e.platforms||[]).map(k=>PM[k]?PM[k][0]:k);
  const plats = labels.map((_,i)=>platPill(e.platforms[i])).join(" ") || platPill("news");
  const raw = (e.platform_raw||"").trim();
  const showRaw = raw && raw !== labels.join("+") && raw !== labels[0];
  const link = e.url ? '<a class="btn pri" href="'+esc(e.url)+'" target="_blank" rel="noopener">打开原帖 ↗</a>' : '';
  const copyBtn = '<button class="btn" data-copy="'+esc(e.raw)+'">复制原文</button>';
  return '<div class="entry" data-brand="'+(e.brand||"")+'">'+
    '<div class="er1"><span class="no">'+(CIRCLED[idx]||("["+(idx+1)+"]"))+'</span>'+
    '<span class="ttl">'+hl(e.title||"（无标题）")+'</span></div>'+
    '<div class="meta">'+
      '<span>'+plats+(showRaw? ' <b>'+hl(raw)+'</b>':'')+'</span>'+
      (e.author? '<span>作者 <b>'+hl(e.author)+'</b></span>':'')+
      (e.publish_time? '<span>发布 <b>'+hl(e.publish_time)+'</b></span>':'')+
      (e.interaction? '<span>互动 <b>'+hl(e.interaction)+'</b></span>':'')+
    '</div>'+
    (e.note? '<div class="meta" style="margin-top:5px">备注 <b>'+hl(e.note)+'</b></div>':'')+
    '<div class="acts">'+link+copyBtn+'</div>'+
  '</div>';
}

function covMatrix(b){
  const plats = COVORDER;
  const cols = plats.length;
  let head = '<div class="matrix" style="grid-template-columns:76px repeat('+cols+',1fr)"><div class="h">渠道覆盖</div>' +
             plats.map(p=>'<div class="h">'+PM[p][0]+'</div>').join("") + '</div>';
  let rows = "";
  Object.keys(BM).forEach(bk=>{
    let cells = "";
    plats.forEach(p=>{
      const hit = b.entries.filter(e=>e.brand===bk && (e.platforms||[]).indexOf(p)>=0).length;
      const info = (b.cov[bk]||{})[p];
      let cls = "no", txt = "未跑";
      if(hit>0){ cls = "hit"; txt = hit+" 命中"; }
      else if(info && (info.items>0 || (info.status && info.status!=="none") || (info.files||[]).length)){ cls="yes"; txt="已跑"; }
      let tip = "无产物";
      if(info) tip = (info.files||[]).join(", ") + " · 原始卡片 " + info.items + " · noresult 词 " + info.noresult;
      cells += '<div class="cell '+cls+'" title="'+esc(tip)+'">'+txt+'</div>';
    });
    rows += '<div class="matrix" style="margin-top:6px;grid-template-columns:76px repeat('+cols+',1fr)">'+
              '<div class="bn"><span class="bar" style="background:'+BM[bk][2]+'"></span>&nbsp;'+BM[bk][1].split(" ")[0]+'</div>'+cells+'</div>';
  });
  return head + rows;
}

function batchBody(b){
  let groups = {};
  b.entries.filter(entryMatches).forEach((e,i)=>{
    const k = e.brand || "其他";
    (groups[k] = groups[k] || []).push([e,i]);
  });
  let html = "";

  // 覆盖提示 / 历史说明
  if(b.coverage && b.coverage.length){
    b.coverage.forEach((c,i)=>{
      if(c.length > 90){
        html += '<details class="covnote"'+(i===0?" open":"")+'><summary>历史覆盖说明（'+
                c.replace(/^[\s\S]*?覆盖说明[:：]?/,"").slice(0,42)+'…）</summary>'+
                '<div class="long">'+esc(c)+'</div></details>';
      } else {
        html += '<div class="covnote">'+esc(c)+'</div>';
      }
    });
  }

  const brandOrder = Object.keys(BM).filter(k=>groups[k]);
  if(!brandOrder.length && !b.noneg_brands.length){
    html += '<div class="empty">'+(state.q||state.brand!=="ALL" ? "当前筛选下无结果" : "本班次无推送内容")+'</div>';
  }

  brandOrder.forEach(bk=>{
    const color = BM[bk] ? BM[bk][2] : "#666";
    html += '<div class="brandsec"><div class="brandhd"><span class="bar" style="background:'+color+'"></span>'+
            '<span class="nm">'+esc(brandName(bk))+'</span>'+
            '<span class="cnt">'+groups[bk].length+' 条 · ✘ 负面</span></div>';
    const list = groups[bk].slice().sort((a,c)=>(a[0].publish_time||"").localeCompare(c[0].publish_time||""));
    list.forEach((pair,i)=>{ html += entryHtml(pair[0], i, color); });
    html += '</div>';
  });

  const nonegShow = (state.brand==="ALL" ? b.noneg_brands : b.noneg_brands.filter(x=>x===state.brand));
  if(nonegShow.length){
    const names = nonegShow.map(brandName);
    let line = names.join("、");
    if(names.length>1) line = names.slice(0,-1).join("、") + " 和 " + names[names.length-1];
    html += '<div class="nonegline">✔ '+esc(line)+'：已巡检，无负面舆情。</div>';
  }
  return html;
}

function render(){
  renderBatchList();
  const b = DATA.batches.find(x=>x.key===state.batch) || DATA.batches[0];
  const main = document.getElementById("main");
  if(!b){ main.innerHTML = '<div class="card"><div class="empty">暂无数据</div></div>'; return; }
  state.batch = b.key;
  const dt = b.date.slice(0,2)+"/"+b.date.slice(2)+" "+b.time.slice(0,2)+":"+b.time.slice(2);
  const badge = b.entries.length>0 ? '<span class="badge neg">✘ 负面 '+b.entries.length+'</span>'
                                   : '<span class="badge ok">✔ 无负面</span>';
  main.innerHTML =
    '<div class="card"><h3>'+dt+' 班次 '+badge+'</h3>'+
      '<div class="winline"><span>窗口 <b>'+esc(b.window||"—")+'</b></span>'+
        '<span>·</span><span>推送 '+b.messages.length+' 条</span>'+
        '<button class="btn" id="copyAll" style="margin-left:auto">复制本班次推送原文</button></div>'+
      '<div style="margin-top:12px">'+covMatrix(b)+'</div>'+
    '</div>'+
    '<div class="card">'+batchBody(b)+'</div>';
  const ca = document.getElementById("copyAll");
  if(ca) ca.onclick = ()=>{ navigator.clipboard.writeText(b.messages.map(m=>m.file).join("\n")+"\n\n"+b.entries.map(e=>e.raw).join("\n")); ca.textContent="已复制 ✓"; };
  main.querySelectorAll("[data-copy]").forEach(btn=>btn.onclick=()=>{
    navigator.clipboard.writeText(btn.dataset.copy).then(()=>{ btn.textContent="已复制 ✓"; setTimeout(()=>btn.textContent="复制原文",1200); });
  });
}

document.querySelectorAll(".chip[data-brand]").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip[data-brand]").forEach(x=>x.classList.remove("on"));
  c.classList.add("on"); state.brand = c.dataset.brand; render();
});
document.getElementById("onlyNeg").onclick = function(){
  this.classList.toggle("on"); state.onlyNeg = this.classList.contains("on");
  state.batch = (DATA.batches.find(b=>b.entries.length>0)||DATA.batches[0]).key; render();
};
document.getElementById("q").addEventListener("input", e=>{ state.q = e.target.value; render(); });

// 支持 #1004_1400 直达某班次（便于分享/收藏具体班次）
(function initFromHash(){
  const h = (location.hash||"").replace(/^#/,"").trim();
  if(h && DATA.batches.some(b=>b.key===h)) state.batch = h;
})();

renderKpis();
render();
</script>
